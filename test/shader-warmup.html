<script type="module">
import * as THREE from 'three';
import {createShaderWarmup} from '../rendering/shader-warmup.js';
const result = document.querySelector('#result');
try {
  const renderer = new THREE.WebGLRenderer();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100);
  camera.position.z = 4;
  const scene = new THREE.Scene();

  catch (error) { if (error !== controller.signal.reason) throw error; }
  renderer.compile = compile;
  if (submitted !== 1 || renderer.getRenderTarget() !== previous) throw Error('submitted after withdrawal');

  const removed = warm.compiled(new THREE.Mesh(geometry, abandoned), camera, scene);
  abandoned.dispose();
